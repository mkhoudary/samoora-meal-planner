<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samoora Meal Planner</title>
  <meta name="description" content="Samoora Meal Planner. Made with love by Mohammed. Your numbers stay on this device.">
  <script>
    window.SAMOORA_UI = Date.now();
    (function () {
      var v = window.SAMOORA_UI;
      ["icon", "apple-touch-icon"].forEach(function (rel) {
        var link = document.createElement("link");
        link.rel = rel;
        link.href = "./assets/favicon.png?v=" + v;
        document.head.appendChild(link);
      });
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "./css/app.css?v=" + v;
      document.head.appendChild(css);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script>
</head>
<body>
  <div id="app">
    <div class="hero-logo">
      <img id="splash-logo" alt="Samoora Meal Planner">
      <script>document.getElementById("splash-logo").src = "./assets/logo.png?v=" + window.SAMOORA_UI;</script>
      <p class="love">Setting the table...</p>
    </div>
  </div>
  <script>
    document.write('<script src="./vendor/sql-wasm.js?v=' + window.SAMOORA_UI + '"><\/script>');
    document.write('<script type="module" src="./js/app.js?v=' + window.SAMOORA_UI + '"><\/script>');
  </script>
</body>
</html>
